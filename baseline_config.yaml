dataset:
  directory_to_reconstructions: # need to specify
  sub_recon_name0: # need to specify
  sub_recon_name1: # need to specify
  full_recon_name: # need to specify
train:
  psz: 256
  n_slices: 5
  mbsz: 32
  lr: 0.001
  warmup: 2000
  maxep: 2000
  patience: 0  # Set a positive count to enable early stopping
  early_stopping_window: 10
  min_delta: 0.001  # Absolute improvement in mean evaluation total loss
infer:
  overlap: 0.5
  window: "cosine"
