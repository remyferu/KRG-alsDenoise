<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAFNet25D architecture | KRG-alsDenoise</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #e7edf3; color: #172b42; font: 15px system-ui, sans-serif; }
header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #ccd8e4; }
h1 { font-size: 20px; margin: 0 0 5px; }
p { margin: 0; color: #54687b; }
nav { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
button, a { border: 1px solid #bbcddd; border-radius: 5px; padding: 8px 12px; background: white; color: #214d78; font: inherit; }
button { cursor: pointer; }
button:hover, a:hover { background: #edf5fc; }
button:focus-visible, a:focus-visible { outline: 3px solid #2864a0; outline-offset: 3px; }
output { min-width: 58px; text-align: center; }
#viewport { height: calc(100dvh - 155px); overflow: auto; padding: 20px; cursor: grab; touch-action: pan-x pan-y; }
#viewport.dragging { cursor: grabbing; }
img { display: block; background: white; box-shadow: 0 3px 15px #172b4226; height: auto; max-width: none; user-select: none; }
@media (max-width: 650px) { header { padding: 12px; } #viewport { height: calc(100dvh - 220px); padding: 12px; } }
@media print { header { display: none; } #viewport { height: auto; overflow: visible; padding: 0; } img { width: 100% !important; box-shadow: none; } }
</style>
</head>
<body>
<header>
<h1>NAFNet25D architecture</h1>
<p>Implemented five-slice defaults. Drag to pan; use the controls or Ctrl + mouse wheel to zoom.</p>
<nav aria-label="Diagram controls">
<button type="button" id="out" aria-label="Zoom out">−</button>
<output id="scale" aria-live="polite">100%</output>
<button type="button" id="in" aria-label="Zoom in">+</button>
<button type="button" id="fit">Fit width</button>
<button type="button" id="full">100%</button>
<a href="nafnet25d-architecture.svg" download>Download SVG</a>
<a href="nafnet25d-architecture.png" download>Download PNG</a>
</nav>
</header>
<main id="viewport" tabindex="0" aria-label="Scrollable neural network diagram">
<img id="diagram" src="nafnet25d-architecture.svg" draggable="false"
 alt="NAFNet25D network: shared per-slice stem, gated neighbor corrections, full-resolution detail branch and two-level encoder-decoder with additive skips, residual head, and center-image shortcut. Lower panels explain axial fusion, every NAFBlock operation, and paired CT training.">
</main>
<script>
const viewport = document.querySelector('#viewport');
const diagram = document.querySelector('#diagram');
let zoom = 1;
const nativeWidth = 2400;
function setZoom(next, x = viewport.clientWidth / 2, y = viewport.clientHeight / 2) {
  const old = zoom;
  zoom = Math.min(3, Math.max(0.08, next));
  const anchorX = (viewport.scrollLeft + x) / old;
  const anchorY = (viewport.scrollTop + y) / old;
  diagram.style.width = `${nativeWidth * zoom}px`;
  viewport.scrollLeft = anchorX * zoom - x;
  viewport.scrollTop = anchorY * zoom - y;
  document.querySelector('#scale').value = `${Math.round(zoom * 100)}%`;
}
function fit() {
  setZoom((viewport.clientWidth - 40) / nativeWidth, 0, 0);
  viewport.scrollTop = 0;
  viewport.scrollLeft = 0;
}
document.querySelector('#out').onclick = () => setZoom(zoom / 1.25);
document.querySelector('#in').onclick = () => setZoom(zoom * 1.25);
document.querySelector('#fit').onclick = fit;
document.querySelector('#full').onclick = () => setZoom(1);
viewport.addEventListener('wheel', event => {
  if (!event.ctrlKey) return;
  event.preventDefault();
  const bounds = viewport.getBoundingClientRect();
  setZoom(zoom * Math.exp(-event.deltaY * .002), event.clientX - bounds.left, event.clientY - bounds.top);
}, {passive: false});
let drag = null;
viewport.addEventListener('pointerdown', event => {
  if (event.pointerType !== 'mouse' || event.button !== 0) return;
  drag = {x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop};
  viewport.setPointerCapture(event.pointerId);
  viewport.classList.add('dragging');
});
viewport.addEventListener('pointermove', event => {
  if (!drag) return;
  viewport.scrollLeft = drag.left - event.clientX + drag.x;
  viewport.scrollTop = drag.top - event.clientY + drag.y;
});
function endDrag() { drag = null; viewport.classList.remove('dragging'); }
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointercancel', endDrag);
diagram.addEventListener('load', fit);
if (diagram.complete) fit();
</script>
</body>
</html>
